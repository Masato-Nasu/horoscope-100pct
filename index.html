<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f5"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.svg"><title>100% 星占い</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#292723;font:16px Helvetica,Arial,sans-serif}main{max-width:550px;margin:auto;padding:clamp(34px,8vh,80px) 24px}h1{font-size:36px;letter-spacing:-.055em;margin:0 0 28px}h1 span{color:#9b782e;font-size:.65em}form{display:grid;gap:16px}label{display:grid;gap:5px;font-size:14px}input,select,button{font:inherit;padding:11px;border:1px solid #cbc7bb;border-radius:8px;background:white;color:inherit;max-width:100%;min-width:0}button{cursor:pointer}form button{background:#302f2a;color:white}details{margin:16px 0}summary{cursor:pointer}details label{margin-top:12px}dl{display:grid;grid-template-columns:1fr 1fr;margin:16px 0;gap:0 22px}dl div{padding:16px 0;border-top:1px solid #d8d4c8}dd{margin:4px 0;font-size:40px;font-variant-numeric:tabular-nums}small{font-size:18px}p{line-height:1.85}#edit{background:transparent;font-size:13px}#reason{font-size:14px;color:#5f5c54}[hidden]{display:none!important}
</style></head><body><main><h1>100% 星占い <span>✦</span></h1>
<form id="profile"><label>生年月日<input id="birth" type="date" required></label><label>出生地<select id="zone"><option value="Asia/Tokyo">日本（全国）</option></select></label><details><summary>出生時刻・占いたい日</summary><label>出生時刻（任意）<input id="time" type="time"></label><label>占いたい日<input id="day" type="date"></label></details><button>占う</button></form><p id="error" role="alert"></p>
<section id="result" hidden><time id="stamp"></time><dl id="scores"></dl><p id="message"></p><details><summary>星の理由</summary><p id="reason"></p></details><button id="edit">入力を変更</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script><script src="v6-core.js"></script><script src="reading.js"></script><script src="daily.js"></script></body></html>
