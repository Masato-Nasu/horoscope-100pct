<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B79DF2">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>100% 星占い</title>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;margin:0;background:#fff;color:#333;padding:12px 8px 32px}
.card{max-width:680px;margin:0 auto;background:#fff;border-radius:24px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:18px 16px 24px}
.header{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.icon{font-size:38px}.title{font-size:25px;font-weight:650;color:#7C4DFF}.badge{font-size:12px;background:#F0EAFF;color:#6D42D8;padding:4px 8px;border-radius:999px;margin-left:auto}
.row{margin:10px 0;text-align:left}label{display:block;margin-bottom:4px;color:#555;font-size:15px}
input,select{width:100%;padding:9px 10px;border:1px solid #DDD5F6;border-radius:12px;font:inherit;background:#fff}
button{width:100%;border:0;border-radius:12px;padding:12px;margin-top:12px;font-size:18px;font-weight:650;color:white;background:linear-gradient(135deg,#B79DF2,#7C4DFF);cursor:pointer}
.secondary{background:#fff;color:#7C4DFF;border:1px solid #D4C4FF}
.status{margin:10px 0 0;font-size:13px;color:#777;line-height:1.5}
.hero{margin-top:18px;padding:18px 16px;border-radius:18px;background:#F7F4FF}
.scoreline{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.scorelabel{font-size:18px;color:#6D42D8;font-weight:650}.score{font-size:38px;font-weight:750;color:#7C4DFF}
.mode{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:999px;background:#fff;color:#6D42D8;font-weight:650}
.guide{font-size:22px;line-height:1.55;margin:12px 0 4px}.action{font-size:16px;line-height:1.7;color:#555}
.factor-title{margin:18px 0 8px;text-align:left;font-size:17px;font-weight:700;color:#6D42D8}
.factor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.factor{padding:13px;border-radius:14px;background:#FAF9FE;text-align:left}
.factor .k{font-size:13px;color:#777}.factor .v{font-size:18px;color:#5F3BC4;font-weight:700;margin-top:4px}.factor .s{font-size:13px;color:#666;line-height:1.5;margin-top:5px}
.section{margin-top:14px;border:1px solid #E7E0F8;border-radius:16px;padding:14px;background:#fff;text-align:left}
.section h3{margin:0 0 10px;font-size:17px;color:#6D42D8}
.advice{padding:10px 0;border-top:1px solid #EEE}.advice:first-of-type{border-top:0;padding-top:0}
.advice-title{font-weight:700}.advice-text{margin-top:5px;line-height:1.65;color:#555}
.category{padding:12px 0;border-top:1px solid #EEE}.category:first-of-type{border-top:0;padding-top:0}
.category-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.category-name{font-weight:700;font-size:17px}.category-score{font-weight:750;color:#6D42D8;font-size:19px}
.category-text{margin-top:6px;line-height:1.65;color:#555}
details{margin-top:12px;border:1px solid #E7E0F8;border-radius:14px;padding:10px 12px;background:#fff;text-align:left}
summary{cursor:pointer;color:#6D42D8;font-weight:650}
.reason{margin-top:10px;padding:10px 0;border-top:1px solid #EEE}.reason:first-of-type{border-top:0}
.reason-title{font-weight:700}.reason-sub{font-size:14px;color:#777;margin-top:3px}.reason-text{margin-top:6px;line-height:1.6;color:#555}
.meta{font-size:12px;color:#777;line-height:1.7;margin-top:8px}
.note{font-size:12px;color:#888;line-height:1.6;margin-top:8px}
@media(max-width:600px){body{padding:0}.card{max-width:none;border-radius:0;box-shadow:none;min-height:100vh}.factor-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="card">
  <div class="header"><div class="icon">🪐</div><div class="title">100% 星占い</div><div class="badge">v6</div></div>
  <div class="row"><label for="birth">生年月日</label><input id="birth" type="date" value="1978-12-31"></div>
  <div class="row"><label for="targetDate">占いたい日（空欄なら今日）</label><input id="targetDate" type="date"></div>
  <div class="row"><label for="place">環境を読む場所</label>
    <select id="place">
      <option value="35.6812,139.7671,東京">東京</option>
      <option value="34.6937,135.5023,大阪">大阪</option>
      <option value="35.0116,135.7681,京都">京都</option>
      <option value="43.0618,141.3545,札幌">札幌</option>
      <option value="33.5904,130.4017,福岡">福岡</option>
    </select>
  </div>
  <button id="geoBtn" class="secondary" type="button">現在地を使う</button>
  <button id="calcBtn" type="button">この日の運勢とガイドを見る</button>
  <div class="status" id="status">同じ日の同じ条件では、同じ結果を表示します。</div>
  <div id="result"></div>
</div>
<script src="v6-core.js"></script>
<script src="v6-guide.js"></script>
<script src="v6-app.js"></script>
</body>
</html>
